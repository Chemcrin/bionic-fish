    <path d="M-308 110 C-210 -5 -110 148 0 72 C110 -5 197 -50 307 -158" fill="none" stroke="#13A89E" stroke-width="58" stroke-linecap="round"/>
    <path d="M-318 202 C-180 102 -110 252 5 186 C126 117 213 93 316 9" fill="none" stroke="#103D73" stroke-width="34" stroke-linecap="round"/>
    <circle cx="-318" cy="202" r="29" fill="#13A89E"/>
    <circle cx="316" cy="9" r="22" fill="#13A89E"/>
    <circle cx="307" cy="-158" r="22" fill="#13A89E"/>
    <path d="M-260 -135 C-158 -278 60 -350 239 -238" fill="none" stroke="#8ECDE0" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-260" cy="-135" r="18" fill="#8ECDE0"/>
    <g transform="translate(84 -118)">
      <path d="M0 -164 L37 -44 L163 0 L37 43 L0 164 L-37 43 L-163 0 L-37 -44 Z" fill="#F6B82D"/>
      <circle r="21" fill="#FFF5D8"/>
