  </g>

  <g text-anchor="middle" fill="#103D73">
    <text x="800" y="1155" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="184" font-weight="700" letter-spacing="18">天和星</text>
    <text x="800" y="1262" font-family="Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="13" fill="#13A89E">TIAN HE XING</text>
  </g>
  <path d="M535 1334 H1065" stroke="#D6DEE9" stroke-width="4"/>
  <text x="800" y="1416" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="500" letter-spacing="5" fill="#49677F">STM32 DEVELOPMENT BOARD</text>
</svg>
